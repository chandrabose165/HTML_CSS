<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            button {
margin-top:15px;
                padding: 10px;
                background-color: #88da0c;
                color: white;
                border: none;
                border-radius: 5px;
                cursor: pointer;
            }
.formid input{
padding: 5px;
        </style>
        
    </head>
    <body>
        <form class="formid"> 
            <label for="username" >username </label>
            <input type="text" minlength="12"><br> <br>

            <label for="phone number">Phone number</label>
            <input type="tel" placeholder="123-456-7890"><br> <br>

            <label for="password">password:</label>
            <input type="password" required><br> <br>

            <label for="email">Email</label>
            <input type="email" id="email" placeholder="axy@gmail.com"><br> <br>

            <label for="bday">Birthdate</label>
            <input type="date"><br> <br>

            <label for="title">title:</label>

            <label for="Mr">Mr</label>
            <input type="radio" id="Mr" value="Mr" name="title">
            <label for="Ms">Ms</label>
            <input type="radio" id="Ms" value="Ms"  name="title"><br> <br>

            <label for="payments">payments</label>
            <select id="payments">
                <option value="visa">visa</option>
                <option value="mastercard">mastercard</option>
                <option value="debtcard">Debtcard</option>
            </select>
            <br><br>
            <label for="SUBSCRIBE">SUBSCRIBE</label>
            yes<input  type="checkbox" />
no<input type="checkbox" />
            <br><br>

            <label for="file">File:</label>
            <input type="file">
            <br><br>

            <label for="gender">GENDER</label>
            <select id="gender">
            <option value="MALE">MALE</option>
            <option value="female" >female</option>
        </select> <br>
            <button type="submit">Register</button>
        </form>

    </body>
</html>
