<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Navigation Bar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: #0e0d0d;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10;
            box-shadow: 0 4px 8px rgba(42, 2, 239, 0.2);
        }

        nav ul {
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 10px 0;
            list-style: none;
        }

        nav ul li {
            margin: 0 15px;
        }

        nav ul li a {
            color: white;
            text-decoration: none;
            font-size: 18px;
            padding: 10px;
            transition: all 0.3s ease;
        }

        nav ul li a:hover {
            background-color: #5c5353;
            border-radius: 5px;
        }

        .section {
            height: 100vh;
            padding: 50px;
            text-align: center;
            font-size: 24px;
            background-color: #f0f0f0;
            margin-top: 60px; /* To offset the fixed nav bar */
        }
    </style>
</head>
<body>
    <nav>
        <ul>
            <li><a href="#home" class="nav-link">Home</a></li>
            <li><a href="#about" class="nav-link">About</a></li>
            <li><a href="#services" class="nav-link">Services</a></li>
            <li><a href="#contact" class="nav-link">Contactus</a></li>
        </ul>
    </nav>
    <section id="home" class="section">Home Section</section>
    <section id="about" class="section">About Section</section>
    <section id="services" class="section">Services Section</section>
    <section id="contact" class="section">Contactus Section</section>
</body>
</html>
