<!DOCTYPE html>
<html lang="en">
    <head>
        <style>
            *{
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                max-height: 100%;
                max-width: 100%;
            }
            .header-container{
                box-shadow: 0px 0px 5px 0px black;
           
            }
            .header-container .nav-container{
                padding: 15px;

            }
            .header-container .nav-container a{
                border-radius: 5px;
                padding: 8px;
                color: black;
                margin-left:150px ;
                text-align: center;
                text-decoration:none;
                margin-right: 50px;
            }
            .nav-container a:hover{
                box-shadow: 0px 0px 5px black;
                
            }
            .main-container img{
                margin-top: 50px;
                margin-left: 20%;
                width: 50%;
                height: 50%;
            }
            .main-container img:hover{
                cursor: pointer;
                box-shadow: 0px 0px 5px 0px black;

            }
            .main-container p{
                margin: 15px;
                margin-top: 15px;
            }
            footer{
                position: fixed;
                padding:10px;
                background-color:black;
                color:white;
                text-align:center;
                font-size:12px;
                left: 0;
                bottom: 0;
                width: 100%;
            }

        </style>


    </head>
    <body>
        <header class="header-container">
            <nav class="nav-container">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Product</a>
            <a href="#">contactus</a>
            <a href="#">Service</a>
            </nav>
        </header>
        <main class="main-container">
            <img src="thumbnail-09.png">
            
        </main>
        <footer><p>&copy;2026 Chandrabose</p></footer>
    </body>
</html>
