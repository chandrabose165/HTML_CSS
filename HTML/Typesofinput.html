<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        input{
            display: flex;
            margin-top: 15px;
        }
    </style>
    <title>Types of inputs</title>
</head>
<body>
    <input type="text" placeholder="text"/>
    Male<input type="radio" />
    <input type="password" placeholder="password" />
    <input type="range" />
    <input type="reset" />
    <input type="submit"/>
    <input type="tel" placeholder="telephone"/>
    <input type="email" placeholder="email" />
    <input type="file"  accept=".pdf"/>
    <input type="image" src="thumbnail-09.png" />
    <input type="date" />
    <input type="search"/>
    <input type="week"/>
    <input type="color" />
    <input style="background-color:black; color: white;" type="hidden "/> 

</body>
</html>
