<!DOCTYPE html>
<html lang="en">
<head>
    <title>Empty tags and container tags</title>
</head>
<body>

    <!-- The Empty tag doesn't contain close tag it has own close tag -->
    <img />
    <br>
    <meta>
    <link>
    <input />
    <hr>
    <!-- The container tag contain both starting and ending tag-->
    <label></label>
    <p></p>
    <select></select>
    <a></a>
    <video></video>
    

</body>
</html>
