<!DOCTYPE html>
<html>
    <head>
        <title>
            Text Formatting
        </title>
            <body>
                <h1>
                    Text Formatting types
                </h1>
                <br>
                <p><b>This is Chandrabose</b> </p>
                <p><i>This is Chandrabose</i></p>
                <p><u>This is Chandrabose</u></p>
                <p><del>This is Chandrabose<del></p>
                <p>This is<big>Chandrabose<big></p>
                <p>This is<small>Chandrabose</small></p>
                <p>This is <sub>Chandrabose</sub></p>
                <p>This is<sup>Chandrabose</sup></p>
                <p>This is<tt>Chandrabose</tt></p>
                <p>This is<mark style="background-color: chocolate;">Chandrabose</mark></p>
            </body>
        </title>
    </head>
</html>
